name: api_central_sdk
description: Dart SDK for API Central S2S — messaging, notifications, support, live streaming and calls.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  # json_serializable 6.14 exige json_annotation >=4.12.0.
  json_annotation: ^4.12.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  # 2.15.2+ exige analyzer >=13.3, incompatible avec freezed 3.2.5 (analyzer <11).
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  lints: ^6.0.0
  test: ^1.25.0
  http_mock_adapter: ^0.6.1
